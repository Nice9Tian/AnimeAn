<!doctype html>
<html><head><meta charset="utf-8"><title>Layered canvas bench</title>
<style>body{margin:0;background:#fff;font:14px monospace}canvas{width:480px;height:270px;border:1px solid #888;display:block}pre{white-space:pre-wrap;padding:8px}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas><pre id="out">running…</pre>
<script>
// The frame that decides pen feel: committed strokes sit in a cached bitmap and
// only the live stroke is redrawn. finish() is measured alone and subtracted.
const W = 1920, H = 1080, SEGMENTS = 40;
function strokePoints(i) {
  let x = 960 + 900 * Math.sin(i * 0.7), y = 540 + 500 * Math.cos(i * 1.3);
  const pts = [x, y];
  for (let j = 0; j < SEGMENTS; j++) {
    const a = (i + j) * 0.37, b = (i - j) * 0.53;
    const x1 = x + 12 * Math.sin(a), y1 = y + 12 * Math.cos(b);
    const x2 = x1 + 12 * Math.cos(a), y2 = y1 + 12 * Math.sin(b);
    const x3 = x2 + 12 * Math.sin(b), y3 = y2 + 12 * Math.cos(a);
    pts.push(x1, y1, x2, y2, x3, y3);
    x = x3; y = y3;
  }
  return pts;
}
function toPath(pts) {
  const p = new Path2D();
  p.moveTo(pts[0], pts[1]);
  for (let k = 2; k < pts.length; k += 6) p.bezierCurveTo(pts[k], pts[k+1], pts[k+2], pts[k+3], pts[k+4], pts[k+5]);
  return p;
}
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
const glc = document.createElement("canvas"); glc.width = glc.height = 4;
const gl = glc.getContext("webgl2");
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
const fb = gl.createFramebuffer(), px = new Uint8Array(4);
function finish() {
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
}
const median = (a) => a.slice().sort((x, y) => x - y)[a.length >> 1];
const tick = () => new Promise((r) => setTimeout(r, 0));
const pen = (c) => { c.strokeStyle = "rgb(20,20,30)"; c.lineWidth = 3; c.lineCap = "round"; c.lineJoin = "round"; };
async function run() {
  const lines = [];
  const base = [];
  for (let i = 0; i < 30; i++) {
    const t = performance.now();
    ctx.fillStyle = i % 2 ? "#fff" : "#fefefe"; ctx.fillRect(0, 0, 4, 4);
    finish();
    base.push(performance.now() - t);
    await tick();
  }
  const floor = median(base);
  lines.push("flush floor ms " + floor.toFixed(2));
  for (const count of [3000, 10000]) {
    const layer = new OffscreenCanvas(W, H), lc = layer.getContext("2d", { alpha: false });
    lc.fillStyle = "#fff"; lc.fillRect(0, 0, W, H); pen(lc);
    for (let i = 0; i < count; i++) lc.stroke(toPath(strokePoints(i)));
    const bitmap = layer.transferToImageBitmap();
    // Live stroke of 800 samples, growing as the pen moves.
    const live = Array.from({ length: 800 }, (_, i) => [200 + i * 1.8, 500 + 200 * Math.sin(i * 0.02)]);
    const times = [], times_img = [];
    for (let f = 0; f < 60; f++) {
      const n = 200 + f * 10;
      let t = performance.now();
      ctx.drawImage(bitmap, 0, 0);
      pen(ctx);
      ctx.beginPath();
      ctx.moveTo(live[0][0], live[0][1]);
      for (let i = 1; i < n; i++) ctx.lineTo(live[i][0], live[i][1]);
      ctx.stroke();
      finish();
      times.push(performance.now() - t);
      await tick();
      t = performance.now();
      ctx.setTransform(1 + 0.002 * f, 0, 0, 1 + 0.002 * f, f, f);
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(bitmap, 0, 0);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      finish();
      times_img.push(performance.now() - t);
      await tick();
    }
    bitmap.close();
    lines.push(JSON.stringify({ strokes: count, live_stroke_frame_ms: +(median(times) - floor).toFixed(1),
      cached_pan_zoom_frame_ms: +(median(times_img) - floor).toFixed(1) }));
    document.getElementById("out").textContent = lines.join("\n");
    await tick();
  }
  lines.push("DONE");
  window.__result = lines;
  document.getElementById("out").textContent = lines.join("\n");
}
run().catch((e) => { window.__result = ["ERROR " + e]; document.getElementById("out").textContent = "ERROR " + e; });
</script></body></html>
