<!doctype html>
<html><head><meta charset="utf-8"><title>Canvas draw bench</title>
<style>body{margin:0;background:#fff;font:14px monospace}canvas{width:480px;height:270px;border:1px solid #888;display:block}pre{white-space:pre-wrap;padding:8px}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas><pre id="out">running…</pre>
<script>
// Same scene and frames as main.cpp. Each frame is forced to completion by
// copying the canvas into a WebGL texture and reading one pixel back:
// getImageData would push Chrome's canvas onto the CPU after a few reads.
const W = 1920, H = 1080, SEGMENTS = 40;
function makeStrokes(count) {
  const out = [];
  for (let i = 0; i < count; i++) {
    let x = 960 + 900 * Math.sin(i * 0.7), y = 540 + 500 * Math.cos(i * 1.3);
    const pts = [x, y];
    for (let j = 0; j < SEGMENTS; j++) {
      const a = (i + j) * 0.37, b = (i - j) * 0.53;
      const x1 = x + 12 * Math.sin(a), y1 = y + 12 * Math.cos(b);
      const x2 = x1 + 12 * Math.cos(a), y2 = y1 + 12 * Math.sin(b);
      const x3 = x2 + 12 * Math.sin(b), y3 = y2 + 12 * Math.cos(a);
      pts.push(x1, y1, x2, y2, x3, y3);
      x = x3; y = y3;
    }
    out.push(pts);
  }
  return out;
}
function makeFills(count) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const cx = 960 + 880 * Math.sin(i * 1.1), cy = 540 + 480 * Math.cos(i * 0.9);
    const pts = [cx + 60, cy];
    for (let j = 1; j <= 6; j++) {
      const a0 = (j - 1) * Math.PI / 3, a1 = j * Math.PI / 3, r = 60 + 20 * Math.sin(i + j);
      pts.push(cx + r * Math.cos(a0 + 0.3), cy + r * Math.sin(a0 + 0.3),
               cx + r * Math.cos(a1 - 0.3), cy + r * Math.sin(a1 - 0.3),
               cx + r * Math.cos(a1), cy + r * Math.sin(a1));
    }
    out.push(pts);
  }
  return out;
}
function toPath(pts, close) {
  const p = new Path2D();
  p.moveTo(pts[0], pts[1]);
  for (let k = 2; k < pts.length; k += 6) p.bezierCurveTo(pts[k], pts[k+1], pts[k+2], pts[k+3], pts[k+4], pts[k+5]);
  if (close) p.closePath();
  return p;
}
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: false });
const glc = document.createElement("canvas"); glc.width = glc.height = 4;
const gl = glc.getContext("webgl2");
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
const fb = gl.createFramebuffer();
const px = new Uint8Array(4);
function finish() {
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
}
function frame(f, strokes, fills) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const s = 1 + 0.002 * f;
  ctx.setTransform(s, 0, 0, s, f * 2, f);
  ctx.fillStyle = "rgba(90,140,220,0.627)";
  for (const p of fills) ctx.fill(p);
  ctx.strokeStyle = "rgb(20,20,30)"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const p of strokes) ctx.stroke(p);
}
const median = (a) => a.slice().sort((x, y) => x - y)[a.length >> 1];
const nextFrame = () => new Promise((r) => setTimeout(r, 0));
async function run() {
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  const renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "?";
  const lines = ["GPU " + renderer, navigator.userAgent, "dpr " + devicePixelRatio];
  const results = [];
  // Warm the canvas before timing.
  for (const count of [500, 3000, 10000]) {
    const raw = makeStrokes(count), rawFills = makeFills(count / 10 | 0);
    const frames = count >= 10000 ? 7 : 15;
    const t0 = performance.now();
    const cached = raw.map((p) => toPath(p, false)), cachedFills = rawFills.map((p) => toPath(p, true));
    const buildMs = performance.now() - t0;
    const A = [], B = [], S = [];
    for (let f = 0; f < frames; f++) {
      let t = performance.now();
      frame(f, cached, cachedFills);
      S.push(performance.now() - t);
      finish();
      A.push(performance.now() - t);
      await nextFrame();
      t = performance.now();
      frame(f, raw.map((p) => toPath(p, false)), rawFills.map((p) => toPath(p, true)));
      finish();
      B.push(performance.now() - t);
      await nextFrame();
    }
    const row = { strokes: count, path2d_build_ms: +buildMs.toFixed(1),
      canvas_cached_ms: +median(A).toFixed(1), canvas_submit_only_ms: +median(S).toFixed(1),
      canvas_rebuild_ms: +median(B).toFixed(1) };
    results.push(row); lines.push(JSON.stringify(row));
    document.getElementById("out").textContent = lines.join("\n");
    await nextFrame();
  }
  window.__result = { lines };
  lines.push("DONE");
  document.getElementById("out").textContent = lines.join("\n");
}
run().catch((e) => { document.getElementById("out").textContent = "ERROR " + e; });
</script></body></html>
