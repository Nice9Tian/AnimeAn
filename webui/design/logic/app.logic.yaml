version: 1

state:
  project:
    title:
      type: string
      initial: "样片镜头"
    width:
      type: number
      initial: 1920
    height:
      type: number
      initial: 1080
    fps:
      type: number
      initial: 24
    fpsLabel:
      type: string
      initial: "24 fps"
    transparent:
      type: boolean
      initial: true
    activeTool:
      type: enum
      values: [arrow, brush, eraser, fill, shape, select, move, eyedropper, h_center_line, v_center_line, mapping_area, additional_line, auto_mapping_2]
      initial: brush
    toolsLocked:
      type: boolean
      initial: false
    workspaceTab:
      type: number
      initial: 0
    zoom:
      type: number
      initial: 100
    currentFrame:
      type: number
      initial: 1
    totalFrames:
      type: number
      initial: 24
    playing:
      type: boolean
      initial: false
    loopPlay:
      type: boolean
      initial: true
    onionSkin:
      type: boolean
      initial: false
    timelineScroll:
      type: number
      initial: 0
    theme:
      type: enum
      values: [dark, graphite, light]
      initial: dark
    stabilizer:
      type: enum
      values: [off, med, high]
      initial: med
    statusMessage:
      type: string
      initial: "就绪"
    exportResult:
      type: string
      initial: "尚未导出"
  forcePad:
    fx:
      type: number
      initial: 0
    fy:
      type: number
      initial: 0
    pressure:
      type: number
      initial: 50
  textureView:
    hostMode:
      type: enum
      values: [tab, embedded, floating]
      initial: tab
    fileName:
      type: string
      initial: "default.textureview"
    followTimeline:
      type: boolean
      initial: true
    followTexture:
      type: boolean
      initial: true
  timeline:
    holdFrames:
      type: number
      initial: 0
    onionLines:
      type: boolean
      initial: true
    onionFills:
      type: boolean
      initial: true
    onionAm:
      type: boolean
      initial: false
    onionGuide:
      type: boolean
      initial: false
  toolOptions:
    schema:
      type: object
      initial:
        row_spacing: 4
        column_spacing: 6
        controls:
          - { name: "color", type: "button", title: "Black", hook: "color", value: "black", row: 0, column: 0, state: { color: "black" } }
          - { name: "color", type: "button", title: "Blue", hook: "color", value: "blue", row: 0, column: 1, state: { color: "blue" } }
          - { name: "color", type: "button", title: "Green", hook: "color", value: "green", row: 0, column: 2, state: { color: "green" } }
          - { name: "smooth", type: "slider", title: "Smooth", hook: "smooth", min: 0, max: 100, value: 50, row: 1, start_column: 0, end_column: 2 }
          - { name: "pen_width", type: "slider", title: "Width", hook: "pen_width", min: 1, max: 50, value: 5, row: 2, start_column: 0, end_column: 2 }
          - { name: "openAdvBrush", type: "subwindow", title: "压感曲线...", hook: "openDrawSettings", row: 3, start_column: 0, end_column: 2 }
    values:
      type: object
      initial:
        color: "black"
        smooth: 50
        pen_width: 5
    lastHook:
      type: string
      initial: "switch:brush"
  layer:
    visible:
      type: boolean
      initial: true
      owner: business
    blendMode:
      type: string
      initial: "Normal"
    opacity:
      type: number
      initial: 100
    locked:
      type: boolean
      initial: false
  layers:
    viewTab:
      type: number
      initial: 0
    items:
      type: array
      initial:
        - { id: "grp_char", name: "角色图层组", kind: "group", isGroup: true, depth: 0, collapsed: false, checked: true, visible: true, locked: false }
        - { id: "lyr_line", name: "人物线稿", kind: "Vector", isGroup: false, depth: 1, collapsed: false, checked: true, visible: true, locked: false }
        - { id: "lyr_bg", name: "远景背景层", kind: "Raster", isGroup: false, depth: 0, collapsed: false, checked: true, visible: true, locked: false }
    selectedIndex:
      type: number
      initial: 0
    nextId:
      type: number
      initial: 4
  assets:
    items:
      type: array
      initial:
        - { id: 1, name: "角色设定草图.png", badge: "PNG" }
        - { id: 2, name: "水彩纸纹理_01.tex", badge: "TEX" }
        - { id: 3, name: "森林背景远景.png", badge: "PNG" }
    selectedIndex:
      type: number
      initial: 0
    nextId:
      type: number
      initial: 4
    note:
      type: string
      initial: "主角全身三视图参考，用于第 1-12 帧原画对位。"
  history:
    items:
      type: array
      initial:
        - { id: 1, name: "初始化画布 (1920x1080)", badge: "#1" }
        - { id: 2, name: "导入角色线稿层", badge: "#2" }
        - { id: 3, name: "绘制第 1 帧关键帧", badge: "#3" }
    selectedIndex:
      type: number
      initial: 2
    mutedFrom:
      type: number
      initial: -1
    nextId:
      type: number
      initial: 4
  inspector:
    tabIndex:
      type: number
      initial: 0
    colorPanelOpen:
      type: boolean
      initial: true
    hue:
      type: number
      initial: 210
    saturation:
      type: number
      initial: 78
    brightness:
      type: number
      initial: 92
    hexColor:
      type: string
      initial: "#3394eb"
  newProject:
    name:
      type: string
      initial: "新动画镜头"
    preset:
      type: string
      initial: "1080p"
    width:
      type: number
      initial: 1920
    height:
      type: number
      initial: 1080
    fps:
      type: number
      initial: 24
    transparent:
      type: boolean
      initial: true
  drawSettings:
    pressureCurve:
      type: string
      initial: "Linear"
    minRadius:
      type: number
      initial: 15
    tiltSensitivity:
      type: number
      initial: 60
    antiAlias:
      type: boolean
      initial: true

conditions:
  canRemoveLayer:
    type: symbol
    expr: layers.items.length > 1 and layers.selectedIndex >= 0
  canMoveLayerUp:
    type: symbol
    expr: layers.selectedIndex > 0
  canMoveLayerDown:
    type: symbol
    expr: layers.selectedIndex >= 0 and layers.selectedIndex < layers.items.length - 1
  canRemoveAsset:
    type: symbol
    expr: assets.items.length > 1 and assets.selectedIndex >= 0
  canRemoveFrame:
    type: symbol
    expr: project.totalFrames > 1
  isArrow:
    type: symbol
    expr: project.activeTool == "arrow"
  isBrush:
    type: symbol
    expr: project.activeTool == "brush"
  isEraser:
    type: symbol
    expr: project.activeTool == "eraser"
  isFill:
    type: symbol
    expr: project.activeTool == "fill"
  isShape:
    type: symbol
    expr: project.activeTool == "shape"
  isSelect:
    type: symbol
    expr: project.activeTool == "select"
  isMove:
    type: symbol
    expr: project.activeTool == "move"
  isEyedropper:
    type: symbol
    expr: project.activeTool == "eyedropper"
  isHLine:
    type: symbol
    expr: project.activeTool == "h_center_line"
  isVLine:
    type: symbol
    expr: project.activeTool == "v_center_line"
  isMapArea:
    type: symbol
    expr: project.activeTool == "mapping_area"
  isAddLine:
    type: symbol
    expr: project.activeTool == "additional_line"
  isAutoMap:
    type: symbol
    expr: project.activeTool == "auto_mapping_2"
  isExtraToolActive:
    type: symbol
    expr: isHLine or isVLine or isMapArea or isAddLine or isAutoMap
  isPropsTab:
    type: symbol
    expr: inspector.tabIndex == 0
  isExportTab:
    type: symbol
    expr: inspector.tabIndex == 1
  isHistoryTab:
    type: symbol
    expr: inspector.tabIndex == 2

events:
  clock.tick:
    - if: project.playing
      then:
        - if: project.currentFrame < project.totalFrames
          then:
            - set: project.currentFrame = project.currentFrame + 1
          else:
            - if: project.loopPlay
              then:
                - set: project.currentFrame = 1
              else:
                - set: project.playing = false
        - set: 'project.statusMessage = "播放时钟推进：" + ms + " ms（第 " + project.currentFrame + " 帧）"'
      else:
        - set: 'project.statusMessage = "时钟同步：" + ms + " ms"'
  openNewProject:
    - set: 'newProject.name = "新动画镜头"'
    - set: 'newProject.preset = "1080p"'
    - fn: syncPresetDimensions
    - openWindow: newProjectDialog
  openProjectFile:
    - set: 'project.title = "导入工程_镜头02"'
    - set: 'project.statusMessage = "已打开项目：导入工程_镜头02"'
    - fn:
        name: recordHistory
        args:
          label: '"打开项目：导入工程_镜头02"'
  saveProjectFile:
    - set: 'project.statusMessage = "已保存项目：" + project.title'
    - fn:
        name: recordHistory
        args:
          label: '"保存项目快照"'
  saveAsProjectFile:
    - set: 'project.title = project.title + "_副本"'
    - set: 'project.statusMessage = "已另存为：" + project.title'
  openTextureFile:
    - set: 'textureView.fileName = "character_uv.textureview"'
    - set: 'project.statusMessage = "已加载纹理视图文件：" + textureView.fileName'
    - fn:
        name: recordHistory
        args:
          label: '"加载纹理视图：character_uv.textureview"'
  saveTextureFile:
    - set: 'project.statusMessage = "已保存纹理视图文件：" + textureView.fileName'
    - fn:
        name: recordHistory
        args:
          label: '"保存纹理视图：" + textureView.fileName'
  toggleTextureFloatWindow:
    - set: 'textureView.hostMode = "floating"'
    - openWindow: textureFloatDialog
    - set: 'project.statusMessage = "已弹出独立纹理浮动子视图 (FloatBox)"'
  embedTextureInToolOptions:
    - set: 'textureView.hostMode = "embedded"'
    - closeWindow: textureFloatDialog
    - set: 'project.statusMessage = "已将纹理子视图嵌入工具选项面板槽位"'
  importImageAsset:
    - push:
        to: assets.items
        item:
          id: assets.nextId
          name: '"贴图素材_" + assets.nextId + ".png"'
          badge: '"PNG"'
    - set: assets.selectedIndex = assets.items.length - 1
    - set: assets.nextId = assets.nextId + 1
    - set: 'project.statusMessage = "已导入图像素材"'
    - fn:
        name: recordHistory
        args:
          label: '"导入外部素材"'
  triggerExportClip:
    - set: inspector.tabIndex = 1
    - call: exportClip
  toggleOnionSkin:
    - set: project.onionSkin = not project.onionSkin
    - set: 'project.statusMessage = project.onionSkin ? "已开启洋葱皮透视" : "已关闭洋葱皮透视"'
  resetWorkspaceLayout:
    - set: project.workspaceTab = 0
    - set: project.zoom = 100
    - set: inspector.tabIndex = 0
    - set: 'textureView.hostMode = "tab"'
    - closeWindow: textureFloatDialog
    - set: 'project.statusMessage = "工作区视图与缩放已重置"'
  undoHistory:
    - fn:
        name: rewindHistory
        args:
          mode: '"undo"'
  redoHistory:
    - fn:
        name: rewindHistory
        args:
          mode: '"redo"'
  clearCurrentFrame:
    - set: 'project.statusMessage = "已清空第 " + project.currentFrame + " 帧画布内容"'
    - fn:
        name: recordHistory
        args:
          label: '"清空第 " + project.currentFrame + " 帧"'
  runAutoColorize:
    - set: 'project.statusMessage = "自动映射：已完成当前帧智能上色"'
    - fn:
        name: recordHistory
        args:
          label: '"执行一键自动上色"'
  runAutoInbetween:
    - set: project.totalFrames = project.totalFrames + 2
    - set: 'project.statusMessage = "自动映射：已生成 2 帧补间动画"'
    - fn:
        name: recordHistory
        args:
          label: '"生成中间帧补间 (+2)"'
  syncTextureMapping:
    - set: project.workspaceTab = 1
    - set: 'textureView.hostMode = "tab"'
    - set: 'project.statusMessage = "已切换至纹理贴图区并同步 UV 映射"'
  openDrawSettings:
    - openWindow: drawSettingsDialog
  setStabilizerOff:
    - set: 'project.stabilizer = "off"'
    - set: 'project.statusMessage = "抖动修正：关闭 (S0)"'
  setStabilizerMed:
    - set: 'project.stabilizer = "med"'
    - set: 'project.statusMessage = "抖动修正：标准 (S5)"'
  setStabilizerHigh:
    - set: 'project.stabilizer = "high"'
    - set: 'project.statusMessage = "抖动修正：强力平滑 (S12)"'
  setThemeDark:
    - set: 'project.theme = "dark"'
    - set: 'project.statusMessage = "已切换主题：深色创作主题"'
  setThemeGraphite:
    - set: 'project.theme = "graphite"'
    - set: 'project.statusMessage = "已切换主题：石墨灰护眼主题"'
  setThemeLight:
    - set: 'project.theme = "light"'
    - set: 'project.statusMessage = "已切换主题：明亮浅色主题"'
  resetActiveToolOptions:
    - fn: syncToolOptions
    - set: 'project.statusMessage = "已重置当前工具默认参数"'
  duplicateSelectedLayer:
    - push:
        to: layers.items
        item:
          id: '"lyr_copy_" + layers.nextId'
          name: '"复制图层 " + layers.nextId'
          kind: '"Vector"'
          isGroup: false
          depth: 0
          collapsed: false
          checked: true
          visible: true
          locked: false
    - set: layers.selectedIndex = layers.items.length - 1
    - set: layers.nextId = layers.nextId + 1
    - set: 'project.statusMessage = "已复制选中图层"'
  toggleSelectedLayerLock:
    - set: layer.locked = not layer.locked
    - if: layers.selectedIndex >= 0
      then:
        - set: layers.items[layers.selectedIndex].locked = layer.locked
    - set: 'project.statusMessage = layer.locked ? "已锁定当前图层" : "已解锁当前图层"'
  deleteSelectedLayer:
    - if: canRemoveLayer
      then:
        - remove:
            from: layers.items
            index: layers.selectedIndex
        - if: layers.selectedIndex >= layers.items.length
          then:
            - set: layers.selectedIndex = layers.items.length - 1
        - set: 'project.statusMessage = "已通过右键菜单删除图层"'
  dissolveLayerGroup:
    - fn:
        name: manageLayerGroup
        args:
          mode: '"dissolve"'
  deleteLayerGroup:
    - fn:
        name: manageLayerGroup
        args:
          mode: '"deleteGroup"'
  resetCanvasZoom:
    - set: project.zoom = 100
    - set: 'project.statusMessage = "画布缩放已重置为 100%"'
  layerToggleVisible:
    owner: business
    text: 用户请求切换当前图层的显示与隐藏
    simulate:
      - set: layer.visible = not layer.visible
  notifyStatus:
    owner: ui
    text: 业务通知界面在状态栏显示一条消息
    params:
      message: string
    steps:
      - set: project.statusMessage = param.message

actions:
  exportClip:
    handler: actions/exportClip.js
    input:
      title: project.title
      layerCount: layers.items.length
    mockResult:
      outputPath: "exports/mock.mp4"
      summary: "模拟导出完成"
    mockError: "磁盘空间不足，导出失败"
    onSuccess:
      - set: project.exportResult = result.summary
      - set: project.statusMessage = result.summary
    onError:
      - set: project.exportResult = error.message
      - set: project.statusMessage = error.message

objects:
  toolsDock:
    doc: docs/window.md#tools-dock
  newProjectBtn:
    doc: docs/window.md#tools-dock
    events:
      click:
        - emit: openNewProject
  toolArrowBtn:
    props:
      variant: 'isArrow ? "primary" : "secondary"'
      checked: isArrow
    events:
      click:
        - set: 'project.activeTool = "arrow"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：选择 (Arrow)"'
      toggle:
        - set: 'project.activeTool = "arrow"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：选择 (Arrow)"'
  toolBrushBtn:
    props:
      variant: 'isBrush ? "primary" : "secondary"'
      checked: isBrush
    events:
      click:
        - set: 'project.activeTool = "brush"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：画笔"'
      toggle:
        - set: 'project.activeTool = "brush"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：画笔"'
  toolEraserBtn:
    props:
      variant: 'isEraser ? "primary" : "secondary"'
      checked: isEraser
    events:
      click:
        - set: 'project.activeTool = "eraser"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：橡皮"'
      toggle:
        - set: 'project.activeTool = "eraser"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：橡皮"'
  toolFillBtn:
    props:
      variant: 'isFill ? "primary" : "secondary"'
      checked: isFill
    events:
      click:
        - set: 'project.activeTool = "fill"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：填充"'
      toggle:
        - set: 'project.activeTool = "fill"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：填充"'
  toolShapeBtn:
    props:
      variant: 'isShape ? "primary" : "secondary"'
      checked: isShape
    events:
      click:
        - set: 'project.activeTool = "shape"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：连接 (Connect)"'
      toggle:
        - set: 'project.activeTool = "shape"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：连接 (Connect)"'
  toolSelectBtn:
    props:
      variant: 'isSelect ? "primary" : "secondary"'
      checked: isSelect
    events:
      click:
        - set: 'project.activeTool = "select"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：套索"'
      toggle:
        - set: 'project.activeTool = "select"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：套索"'
  toolMoveBtn:
    props:
      variant: 'isMove ? "primary" : "secondary"'
      checked: isMove
    events:
      click:
        - set: 'project.activeTool = "move"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：变换 (Transfer)"'
      toggle:
        - set: 'project.activeTool = "move"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：变换 (Transfer)"'
  toolEyedropperBtn:
    props:
      variant: 'isEyedropper ? "primary" : "secondary"'
      checked: isEyedropper
    events:
      click:
        - set: 'project.activeTool = "eyedropper"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：吸管"'
      toggle:
        - set: 'project.activeTool = "eyedropper"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换工具：吸管"'
  toolHLineBtn:
    props:
      enabled: not project.toolsLocked
      variant: 'isHLine ? "primary" : "secondary"'
      checked: isHLine
    events:
      click:
        - set: 'project.activeTool = "h_center_line"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换映射工具：水平中心线 (H Center Line)"'
      toggle:
        - set: 'project.activeTool = "h_center_line"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换映射工具：水平中心线 (H Center Line)"'
  toolVLineBtn:
    props:
      enabled: not project.toolsLocked
      variant: 'isVLine ? "primary" : "secondary"'
      checked: isVLine
    events:
      click:
        - set: 'project.activeTool = "v_center_line"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换映射工具：垂直中心线 (V Center Line)"'
      toggle:
        - set: 'project.activeTool = "v_center_line"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换映射工具：垂直中心线 (V Center Line)"'
  toolMapAreaBtn:
    props:
      enabled: not project.toolsLocked
      variant: 'isMapArea ? "primary" : "secondary"'
      checked: isMapArea
    events:
      click:
        - set: 'project.activeTool = "mapping_area"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换映射工具：映射区域 (Mapping Area)"'
      toggle:
        - set: 'project.activeTool = "mapping_area"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换映射工具：映射区域 (Mapping Area)"'
  toolAddLineBtn:
    props:
      enabled: not project.toolsLocked
      variant: 'isAddLine ? "primary" : "secondary"'
      checked: isAddLine
    events:
      click:
        - set: 'project.activeTool = "additional_line"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换映射工具：辅助引导线 (Additional Line)"'
      toggle:
        - set: 'project.activeTool = "additional_line"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换映射工具：辅助引导线 (Additional Line)"'
  toolAutoMapBtn:
    props:
      enabled: not project.toolsLocked
      variant: 'isAutoMap ? "primary" : "secondary"'
      checked: isAutoMap
    events:
      click:
        - set: 'project.activeTool = "auto_mapping_2"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换映射工具：自动映射 (Auto Mapping 2)"'
      toggle:
        - set: 'project.activeTool = "auto_mapping_2"'
        - fn: syncToolOptions
        - set: 'project.statusMessage = "切换映射工具：自动映射 (Auto Mapping 2)"'
  toolLockPolicyBtn:
    props:
      checked: project.toolsLocked
      variant: 'project.toolsLocked ? "danger" : "secondary"'
      text: 'project.toolsLocked ? "已锁扩展" : "工具锁定"'
    events:
      toggle:
        - set: project.toolsLocked = value
        - if: project.toolsLocked and isExtraToolActive
          then:
            - set: 'project.activeTool = "arrow"'
            - fn: syncToolOptions
            - set: 'project.statusMessage = "扩展映射工具已锁定，自动回退至选择工具 (Arrow)"'
          else:
            - set: 'project.statusMessage = project.toolsLocked ? "已启用工具锁定策略" : "已解除工具锁定策略"'
  forcePadBox:
    doc: docs/window.md#tools-dock
    props:
      text: '"压感板 (" + forcePad.fx + "," + forcePad.fy + ")"'
      variant: 'forcePad.fx > 0 ? "primary" : "secondary"'
    events:
      click:
        - if: forcePad.fx >= 70
          then:
            - set: forcePad.fx = 0
            - set: forcePad.fy = 0
            - set: forcePad.pressure = 50
          else:
            - set: forcePad.fx = forcePad.fx + 35
            - set: forcePad.fy = forcePad.fy + 25
            - set: forcePad.pressure = forcePad.pressure + 20
        - set: 'project.statusMessage = "压感板向量更新：(" + forcePad.fx + ", " + forcePad.fy + ") 压力=" + forcePad.pressure + "%"'
  projectSummaryLabel:
    props:
      text: 'project.title + " (" + project.width + "x" + project.height + ")"'

  layersDock:
    doc: docs/window.md#layers-dock
  layerViewTabBar:
    bind: layers.viewTab
    events:
      change:
        - set: 'project.statusMessage = value == 0 ? "切换至主视图图层表 (Main Layers)" : "切换至子视图图层表 (Child Layers)"'
  addLayerBtn:
    events:
      click:
        - push:
            to: layers.items
            item:
              id: '"lyr_" + layers.nextId'
              name: '"图层 " + layers.nextId'
              kind: '"Vector"'
              isGroup: false
              depth: 0
              collapsed: false
              checked: true
              visible: true
              locked: false
        - set: layers.selectedIndex = layers.items.length - 1
        - set: layers.nextId = layers.nextId + 1
        - set: 'project.statusMessage = "已新建图层"'
  addGroupBtn:
    events:
      click:
        - push:
            to: layers.items
            item:
              id: '"grp_" + layers.nextId'
              name: '"图层组 " + layers.nextId'
              kind: '"group"'
              isGroup: true
              depth: 0
              collapsed: false
              checked: true
              visible: true
              locked: false
        - set: layers.selectedIndex = layers.items.length - 1
        - set: layers.nextId = layers.nextId + 1
        - set: 'project.statusMessage = "已新建图层分组"'
  removeLayerBtn:
    props:
      enabled: canRemoveLayer
    events:
      click:
        - if: canRemoveLayer
          then:
            - remove:
                from: layers.items
                index: layers.selectedIndex
            - if: layers.selectedIndex >= layers.items.length
              then:
                - set: layers.selectedIndex = layers.items.length - 1
            - set: 'project.statusMessage = "已删除图层"'
  moveLayerUpBtn:
    props:
      enabled: canMoveLayerUp
    events:
      click:
        - if: canMoveLayerUp
          then:
            - move:
                in: layers.items
                from: layers.selectedIndex
                to: layers.selectedIndex - 1
            - set: layers.selectedIndex = layers.selectedIndex - 1
            - set: 'project.statusMessage = "图层已上移"'
  moveLayerDownBtn:
    props:
      enabled: canMoveLayerDown
    events:
      click:
        - if: canMoveLayerDown
          then:
            - move:
                in: layers.items
                from: layers.selectedIndex
                to: layers.selectedIndex + 1
            - set: layers.selectedIndex = layers.selectedIndex + 1
            - set: 'project.statusMessage = "图层已下移"'
  unselectLayerBtn:
    events:
      click:
        - set: layers.selectedIndex = -1
        - set: 'project.statusMessage = "已取消图层选中状态"'
  layerList:
    doc: docs/window.md#layers-dock
    bind: layers.selectedIndex
    props:
      items: layers.items
      value: layers.selectedIndex
    events:
      change:
        - set: 'project.statusMessage = "选中图层树节点：" + value'
      toggleCheck:
        - set: layers.items[index].checked = checked
        - set: layers.items[index].visible = checked
        - set: 'project.statusMessage = checked ? "图层树节点已显示" : "图层树节点已隐藏"'
      toggleCollapse:
        - set: layers.items[index].collapsed = collapsed
        - set: 'project.statusMessage = collapsed ? "图层组已折叠" : "图层组已展开"'
      reorder:
        - move:
            in: layers.items
            from: from
            to: to
        - set: layers.selectedIndex = to
        - set: 'project.statusMessage = "图层树已重排：" + from + " → " + to'
  layerVisibleLabel:
    props:
      text: 'layer.visible ? "当前图层：显示" : "当前图层：隐藏"'
  toggleVisibleBtn:
    doc: docs/window.md#toggle-visible-btn
    props:
      text: 'layer.visible ? "隐藏图层" : "显示图层"'
    events:
      click:
        - emit: layerToggleVisible
  addAssetBtn:
    doc: docs/window.md#assets-panel
    events:
      click:
        - emit: importImageAsset
  assetToLayerBtn:
    doc: docs/window.md#assets-panel
    events:
      click:
        - fn:
            name: manageLayerGroup
            args:
              mode: '"assetToLayer"'
  removeAssetBtn:
    props:
      enabled: canRemoveAsset
    events:
      click:
        - if: canRemoveAsset
          then:
            - remove:
                from: assets.items
                index: assets.selectedIndex
            - if: assets.selectedIndex >= assets.items.length
              then:
                - set: assets.selectedIndex = assets.items.length - 1
            - set: 'project.statusMessage = "已移除选中素材"'
  unselectAssetBtn:
    events:
      click:
        - set: assets.selectedIndex = -1
        - set: 'project.statusMessage = "已取消素材选中状态"'
  assetList:
    doc: docs/window.md#assets-panel
    bind: assets.selectedIndex
    props:
      items: assets.items
      value: assets.selectedIndex
    events:
      change:
        - set: 'project.statusMessage = "已切换素材项：" + value'
      reorder:
        - move:
            in: assets.items
            from: from
            to: to
        - set: assets.selectedIndex = to
        - set: 'project.statusMessage = "素材列表已重排：" + from + " → " + to'
  assetNoteInput:
    doc: docs/window.md#assets-panel
    bind: assets.note
    events:
      change:
        - set: 'project.statusMessage = "已更新素材备注"'

  centralArea:
    doc: docs/window.md#central-area
  workspaceTabBar:
    doc: docs/window.md#central-area
    bind: project.workspaceTab
    events:
      change:
        - set: 'project.statusMessage = value == 0 ? "已切换至绘图区 (Drawing)" : "已切换至纹理贴图区 (Texture)"'
  canvasTitleLabel:
    props:
      text: '(project.workspaceTab == 0 ? "画布：" : "纹理贴图：") + project.title + " (" + project.zoom + "%)"'
  zoomSlider:
    bind: project.zoom
    events:
      change:
        - set: 'project.statusMessage = "画布缩放：" + project.zoom + "%"'
  activeToolLabel:
    props:
      text: '"工具：" + project.activeTool'
  textureHostLabel:
    props:
      text: '"纹理子视图：" + (textureView.hostMode == "floating" ? "独立浮窗" : (textureView.hostMode == "embedded" ? "嵌入工具栏" : "中央页签")) + " (" + textureView.fileName + ")"'
  followTimelineCheck:
    bind: textureView.followTimeline
    events:
      change:
        - set: 'project.statusMessage = textureView.followTimeline ? "已开启时间轴纹理跟随" : "已关闭时间轴纹理跟随"'
  followTextureCheck:
    bind: textureView.followTexture
    events:
      change:
        - set: 'project.statusMessage = textureView.followTexture ? "已开启纹理 UV 实时同步" : "已关闭纹理 UV 实时同步"'
  floatTextureBtn:
    events:
      click:
        - emit: toggleTextureFloatWindow
  canvasHost:
    doc: docs/window.md#canvas-host

  inspectorDock:
    doc: docs/window.md#inspector-dock
  toolOptionsForm:
    doc: docs/window.md#tool-options-form
    props:
      schema: toolOptions.schema
      values: toolOptions.values
    events:
      change:
        - fn: applyToolOption
        - if: 'hook == "openDrawSettings"'
          then:
            - openWindow: drawSettingsDialog
        - if: 'hook == "toggleTextureHost"'
          then:
            - emit: embedTextureInToolOptions
        - fn:
            name: recordHistory
            args:
              label: '"调整工具参数：" + name'
  tabPropsBtn:
    props:
      variant: 'isPropsTab ? "primary" : "secondary"'
    events:
      click:
        - set: inspector.tabIndex = 0
  tabHistoryBtn:
    props:
      variant: 'isHistoryTab ? "primary" : "secondary"'
    events:
      click:
        - set: inspector.tabIndex = 2
  tabExportBtn:
    props:
      variant: 'isExportTab ? "primary" : "secondary"'
    events:
      click:
        - set: inspector.tabIndex = 1
  inspectorStack:
    props:
      currentIndex: inspector.tabIndex
  blendCombo:
    bind: layer.blendMode
  opacitySpin:
    bind: layer.opacity
  lockLayerCheck:
    bind: layer.locked
    events:
      change:
        - if: layers.selectedIndex >= 0
          then:
            - set: layers.items[layers.selectedIndex].locked = layer.locked
  exportBtn:
    events:
      click:
        - call: exportClip
  exportResultLabel:
    props:
      text: project.exportResult
  undoBtn:
    doc: docs/window.md#history-panel
    events:
      click:
        - emit: undoHistory
  redoBtn:
    doc: docs/window.md#history-panel
    events:
      click:
        - emit: redoHistory
  clearHistoryBtn:
    doc: docs/window.md#history-panel
    events:
      click:
        - fn:
            name: rewindHistory
            args:
              mode: '"clear"'
  historyList:
    doc: docs/window.md#history-panel
    bind: history.selectedIndex
    props:
      items: history.items
      value: history.selectedIndex
      mutedFrom: history.mutedFrom
    events:
      change:
        - fn:
            name: rewindHistory
            args:
              mode: '"select"'
              index: value
  colorPanelToggleBtn:
    doc: docs/window.md#color-panel
    props:
      enabled: not layer.locked
      selected: inspector.colorPanelOpen
      text: 'inspector.colorPanelOpen ? "收起调色盘" : "展开调色盘"'
    events:
      click:
        - set: inspector.colorPanelOpen = not inspector.colorPanelOpen
  colorPanel:
    doc: docs/window.md#color-panel
    props:
      visible: inspector.colorPanelOpen
    effects:
      visible: PanelExpand
  colorPickerCanvas:
    doc: docs/window.md#color-picker
    props:
      hue: inspector.hue
      saturation: inspector.saturation
      brightness: inspector.brightness
      hexColor: inspector.hexColor
    events:
      click:
        - set: 'inspector.hue = inspector.hue == 210 ? 32 : 210'
        - set: 'inspector.hexColor = inspector.hue == 210 ? "#3394eb" : "#eb8f33"'
  colorHexLabel:
    props:
      text: '"当前颜色：" + inspector.hexColor'
  onionSkinBox:
    doc: docs/window.md#onion-skin-box

  timelineDock:
    doc: docs/window.md#timeline-dock
  playToggleBtn:
    props:
      checked: project.playing
      text: 'project.playing ? "暂停" : "播放"'
      variant: 'project.playing ? "danger" : "primary"'
    events:
      toggle:
        - set: project.playing = value
        - set: 'project.statusMessage = project.playing ? "开始播放时间轴" : "已暂停时间轴播放"'
  prevFrameBtn:
    props:
      enabled: project.currentFrame > 1
    events:
      click:
        - if: project.currentFrame > 1
          then:
            - set: project.currentFrame = project.currentFrame - 1
  nextFrameBtn:
    events:
      click:
        - if: project.currentFrame >= project.totalFrames
          then:
            - set: project.totalFrames = project.currentFrame + 1
        - set: project.currentFrame = project.currentFrame + 1
  addFrameBtn:
    events:
      click:
        - set: project.totalFrames = project.totalFrames + 1
        - set: project.currentFrame = project.totalFrames
        - set: 'project.statusMessage = "已新增关键帧：第 " + project.currentFrame + " 帧"'
        - fn:
            name: recordHistory
            args:
              label: '"新增第 " + project.currentFrame + " 帧"'
  addHoldFrameBtn:
    events:
      click:
        - set: project.totalFrames = project.totalFrames + 1
        - set: timeline.holdFrames = timeline.holdFrames + 1
        - set: project.currentFrame = project.totalFrames
        - set: 'project.statusMessage = "已插入延长帧 (Hold)：第 " + project.currentFrame + " 帧（共 " + timeline.holdFrames + " 延长帧）"'
        - fn:
            name: recordHistory
            args:
              label: '"插入延长帧 #" + project.currentFrame'
  duplicateFrameBtn:
    events:
      click:
        - set: project.totalFrames = project.totalFrames + 1
        - set: project.currentFrame = project.currentFrame + 1
        - set: 'project.statusMessage = "已复制当前帧至第 " + project.currentFrame + " 帧"'
        - fn:
            name: recordHistory
            args:
              label: '"复制帧至 #" + project.currentFrame'
  moveFrameBackBtn:
    props:
      enabled: project.currentFrame > 1
    events:
      click:
        - if: project.currentFrame > 1
          then:
            - set: project.currentFrame = project.currentFrame - 1
            - set: 'project.statusMessage = "已将帧前移至位置 #" + project.currentFrame'
            - fn:
                name: recordHistory
                args:
                  label: '"前移帧至 #" + project.currentFrame'
  removeFrameBtn:
    props:
      enabled: canRemoveFrame
    events:
      click:
        - if: canRemoveFrame
          then:
            - set: project.totalFrames = project.totalFrames - 1
            - if: project.currentFrame > project.totalFrames
              then:
                - set: project.currentFrame = project.totalFrames
            - set: 'project.statusMessage = "已删除末尾帧，当前总帧数：" + project.totalFrames'
  loopToggleBtn:
    props:
      checked: project.loopPlay
      variant: 'project.loopPlay ? "primary" : "secondary"'
    events:
      toggle:
        - set: project.loopPlay = value
        - set: 'project.statusMessage = project.loopPlay ? "已开启循环播放" : "已关闭循环播放"'
  onionToggleBtn:
    props:
      checked: project.onionSkin
      variant: 'project.onionSkin ? "primary" : "secondary"'
    events:
      toggle:
        - set: project.onionSkin = value
        - set: 'project.statusMessage = project.onionSkin ? "已开启洋葱皮透视" : "已关闭洋葱皮透视"'
  onionLinesCheck:
    bind: timeline.onionLines
    events:
      change:
        - set: 'project.statusMessage = timeline.onionLines ? "洋葱皮过滤：显示线稿层" : "洋葱皮过滤：隐藏线稿层"'
  onionFillsCheck:
    bind: timeline.onionFills
    events:
      change:
        - set: 'project.statusMessage = timeline.onionFills ? "洋葱皮过滤：显示填充层" : "洋葱皮过滤：隐藏填充层"'
  onionAmCheck:
    bind: timeline.onionAm
    events:
      change:
        - set: 'project.statusMessage = timeline.onionAm ? "洋葱皮过滤：显示自动映射层" : "洋葱皮过滤：隐藏自动映射层"'
  onionGuideCheck:
    bind: timeline.onionGuide
    events:
      change:
        - set: 'project.statusMessage = timeline.onionGuide ? "洋葱皮过滤：显示辅助线" : "洋葱皮过滤：隐藏辅助线"'
  fpsSelectCombo:
    bind: project.fpsLabel
    events:
      change:
        - set: 'project.fps = value == "12 fps" ? 12 : (value == "30 fps" ? 30 : 24)'
        - set: 'project.statusMessage = "帧率已切换为 " + project.fps + " fps"'
  frameSlider:
    bind: project.currentFrame
    props:
      max: project.totalFrames
      value: project.currentFrame
    events:
      change:
        - set: 'project.statusMessage = "时间轴定位至第 " + project.currentFrame + " 帧"'
  frameInfoLabel:
    props:
      text: '"当前帧：" + project.currentFrame + " / " + project.fps'
  timelineScrollBar:
    bind: project.timelineScroll
    events:
      change:
        - set: 'project.statusMessage = "时间轴视口滚动：" + project.timelineScroll + "%"'
  timelineOffsetLabel:
    props:
      text: '"视口偏移：" + project.timelineScroll + "%"'

  statusTextLabel:
    props:
      text: project.statusMessage
  statusClockLabel:
    props:
      text: '"时钟：" + clock + " ms"'
  statusLayerCountLabel:
    props:
      text: '"图层数：" + layers.items.length'

  newProjectDialog:
    doc: docs/window.md#new-project-dialog
  projectNameInput:
    bind: newProject.name
  presetCombo:
    bind: newProject.preset
    events:
      change:
        - fn: syncPresetDimensions
  widthSpin:
    bind: newProject.width
  heightSpin:
    bind: newProject.height
  transparentCheck:
    bind: newProject.transparent
  cancelNewProjectBtn:
    events:
      click:
        - closeWindow: newProjectDialog
        - set: 'project.statusMessage = "已取消新建项目"'
  confirmNewProjectBtn:
    events:
      click:
        - set: project.title = newProject.name
        - set: project.width = newProject.width
        - set: project.height = newProject.height
        - set: project.fps = newProject.fps
        - set: project.transparent = newProject.transparent
        - closeWindow: newProjectDialog
        - set: 'project.statusMessage = "已创建项目：" + project.title'

  drawSettingsDialog:
    doc: docs/window.md#draw-settings-dialog
  pressureCurveCombo:
    bind: drawSettings.pressureCurve
  minRadiusSpin:
    bind: drawSettings.minRadius
  tiltSensitivitySlider:
    bind: drawSettings.tiltSensitivity
  antiAliasCheck:
    bind: drawSettings.antiAlias
  drawSettingsButtonBox:
    events:
      accept:
        - closeWindow: drawSettingsDialog
        - set: 'project.statusMessage = "已应用压感设置：" + drawSettings.pressureCurve + "（最小笔尖 " + drawSettings.minRadius + "%）"'
        - fn:
            name: recordHistory
            args:
              label: '"更新压感曲线：" + drawSettings.pressureCurve'
      reject:
        - closeWindow: drawSettingsDialog
        - set: 'project.statusMessage = "已取消画笔压感设置"'

  textureFloatDialog:
    doc: docs/window.md#central-area
  textureFloatInfoLabel:
    props:
      text: '"浮动纹理子视图 (" + textureView.fileName + ") — 同步UV=" + (textureView.followTexture ? "开启" : "关闭")'
  dockTextureToTabBtn:
    events:
      click:
        - set: 'textureView.hostMode = "tab"'
        - set: project.workspaceTab = 1
        - closeWindow: textureFloatDialog
        - set: 'project.statusMessage = "已将纹理子视图归还至中央 Texture 页签"'
  embedTextureBtn:
    events:
      click:
        - emit: embedTextureInToolOptions
  closeTextureFloatBtn:
    events:
      click:
        - closeWindow: textureFloatDialog
        - set: 'textureView.hostMode = "tab"'
        - set: 'project.statusMessage = "已关闭纹理浮动窗口"'
